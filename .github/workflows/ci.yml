name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            knowledge/package-lock.json
            discord-bot/package-lock.json

      - name: Install and build knowledge
        working-directory: knowledge
        run: |
          npm ci
          npm run build

      - name: Install and build discord-bot
        working-directory: discord-bot
        run: |
          npm ci
          npm run build
